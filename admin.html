<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trạm điều khiển - Photobooth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="password"]::-ms-reveal, input[type="password"]::-ms-clear { display: none; }
        input[type="password"]::-webkit-reveal { display: none; }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 800; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #6b7280; font-weight: 600; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-24">

    <!-- MENU NỔI CHO TAB 2: LỊCH SỬ THƯ MỤC -->
    <div id="batchContextMenu" class="hidden fixed w-48 bg-white rounded-lg shadow-2xl border border-gray-200 z-[100] overflow-hidden">
        <button id="ctxMenuDrive" onclick="batchOpenDrive()" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-700 hover:bg-blue-50 border-b border-gray-100 flex items-center">🔗 Mở thư mục Drive</button>
        <button id="ctxMenuEdit" onclick="batchEditMSSV()" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-700 hover:bg-blue-50 border-b border-gray-100 flex items-center">✏️ Sửa Tên/MSSV</button>
        <button id="ctxMenuView" onclick="batchViewPasswords()" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-700 hover:bg-blue-50 border-b border-gray-100 flex items-center">👁️ Xem Mật khẩu</button>
        <button id="ctxMenuDelete" onclick="batchDelete()" class="w-full text-left px-4 py-3 text-xs font-bold text-red-600 hover:bg-red-50 flex items-center">🗑️ Xóa thư mục</button>
    </div>

    <!-- MENU NỔI CHO TAB 1: HÀNG ĐỢI -->
    <div id="waitBatchContextMenu" class="hidden fixed w-48 bg-white rounded-lg shadow-2xl border border-gray-200 z-[100] overflow-hidden">
        <button id="ctxWaitMenuEdit" onclick="batchEditWaitMSSV()" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-700 hover:bg-blue-50 border-b border-gray-100 flex items-center">✏️ Sửa Tên/MSSV</button>
        <button id="ctxWaitMenuView" onclick="batchViewWaitPasswords()" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-700 hover:bg-blue-50 border-b border-gray-100 flex items-center">👁️ Xem Mật khẩu</button>
        <button id="ctxWaitMenuDelete" onclick="batchDeleteWait()" class="w-full text-left px-4 py-3 text-xs font-bold text-red-600 hover:bg-red-50 flex items-center">🗑️ Hủy đăng ký</button>
    </div>

    <div class="max-w-md mx-auto bg-white shadow-xl min-h-screen relative overflow-hidden flex flex-col">
        
        <!-- Header & Modern Custom Dropdown -->
        <div class="bg-blue-600 text-white p-4 text-center relative shadow-md z-30" id="adminHeader">
            <h1 class="text-2xl font-black tracking-wider uppercase mb-3">ĐIỀU PHỐI PHOTOBOOTH</h1>
            
            <!-- Nút Refresh góc phải -->
            <button onclick="fetchAllData()" class="absolute top-4 right-4 bg-white/20 hover:bg-white/30 p-2 rounded-full active:scale-95 transition-transform shadow-sm">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>

            <!-- Dropdown Trạng Thái Tùy Chỉnh (Modern UI) -->
            <div class="relative w-full max-w-[280px] mx-auto text-left">
                <button type="button" id="statusDropdownBtn" onclick="toggleStatusDropdown(event)" class="w-full bg-black/20 hover:bg-black/30 border border-white/20 text-white text-sm font-bold py-2.5 px-4 rounded-xl flex justify-between items-center transition-all shadow-inner active:scale-95">
                    <span id="currentStatusText" class="flex items-center gap-2">🟢 Sẵn sàng đón khách</span>
                    <svg id="statusDropdownIcon" class="w-4 h-4 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                
                <!-- Danh sách Menu (Đã xóa trạng thái tải ảnh) -->
                <div id="statusOptions" class="absolute left-0 right-0 mt-2 bg-white rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.2)] border border-gray-100 hidden flex-col overflow-hidden py-1.5 origin-top transition-all duration-200 z-50">
                    <button onclick="selectGlobalStatus('ready', '🟢 Sẵn sàng đón khách')" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors w-full text-left">🟢 Sẵn sàng đón khách</button>
                    <button onclick="selectGlobalStatus('early', '🟡 Mở đăng ký sớm')" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-gray-700 hover:bg-yellow-50 hover:text-yellow-600 transition-colors w-full text-left">🟡 Mở đăng ký sớm</button>
                    <button onclick="selectGlobalStatus('crowded', '🟠 Đang quá tải')" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-gray-700 hover:bg-orange-50 hover:text-orange-600 transition-colors w-full text-left">🟠 Đang quá tải</button>
                    <button onclick="selectGlobalStatus('setup', '🔴 Đang Setup / Bảo trì')" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-gray-700 hover:bg-red-50 hover:text-red-600 transition-colors w-full text-left">🔴 Đang Setup / Bảo trì</button>
                    <button onclick="selectGlobalStatus('break', '🔴 Tạm nghỉ / Đổi ca')" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-gray-700 hover:bg-red-50 hover:text-red-600 transition-colors w-full text-left">🔴 Tạm nghỉ / Đổi ca</button>
                    <button onclick="selectGlobalStatus('closed', '🔴 Đã đóng quầy')" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-gray-700 hover:bg-red-50 hover:text-red-600 transition-colors w-full text-left">🔴 Đã đóng quầy</button>
                </div>
            </div>
        </div>

        <div class="p-4 bg-blue-50 border-b border-blue-100 z-10 shadow-sm">
            <h2 class="text-xs font-bold text-blue-500 uppercase mb-2 tracking-wider flex items-center">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse mr-2"></span> LƯỢT CHỤP HIỆN TẠI
            </h2>
            <div id="activeStudentContainer" class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500 min-h-[80px]">
                <span class="text-gray-400 italic text-sm font-medium">Trống - Sẵn sàng đón khách</span>
            </div>
        </div>

        <div class="flex bg-white shadow-sm z-10 sticky top-0 border-b border-gray-200">
            <button id="btnTab1" onclick="switchTab('tab1')" class="flex-1 py-3 text-center tab-active transition-colors text-sm tracking-wide">HÀNG ĐỢI</button>
            <button id="btnTab2" onclick="switchTab('tab2')" class="flex-1 py-3 text-center tab-inactive transition-colors text-sm tracking-wide">LỊCH SỬ THƯ MỤC</button>
        </div>

        <!-- TAB 1: HÀNG ĐỢI & THÊM NHANH -->
        <div id="tab1" class="flex-1 p-4 fade-in">
            <div class="flex gap-2 mb-4 relative">
                <div class="relative flex-1">
                    <input type="text" id="searchWaiting" placeholder="Tìm MSSV đang đợi..." class="w-full pl-9 pr-3 py-2.5 rounded-lg border border-gray-300 focus:border-blue-500 transition-colors uppercase font-bold text-gray-700 text-sm">
                    <svg class="w-4 h-4 absolute left-3 top-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                
                <!-- Dropdown Thêm Nhanh (Click thay vì Hover) -->
                <div class="relative">
                    <button id="btnQuickAdd" onclick="toggleQuickAddDropdown(event)" class="bg-purple-600 hover:bg-purple-700 text-white h-full px-4 rounded-lg font-bold text-sm shadow-md transition-colors flex items-center justify-center">
                        + THÊM NHANH
                    </button>
                    <!-- Khối thả xuống -->
                    <div id="quickAddDropdown" class="absolute right-0 top-full mt-1 w-40 bg-white rounded-lg shadow-2xl border border-gray-200 hidden z-50 overflow-hidden">
                        <button onclick="openQuickAddModal('student')" class="w-full text-left px-4 py-3 text-xs font-bold text-blue-600 hover:bg-blue-50 border-b border-gray-100 flex items-center">
                            <span class="w-2 h-2 rounded-full bg-blue-500 mr-2"></span> + Sinh viên
                        </button>
                        <button onclick="openQuickAddModal('vip')" class="w-full text-left px-4 py-3 text-xs font-bold text-purple-600 hover:bg-purple-50 flex items-center">
                            <span class="w-2 h-2 rounded-full bg-purple-500 mr-2"></span> + Khách VIP
                        </button>
                    </div>
                </div>

            </div>
            <div id="waitingListContainer" class="space-y-3 pb-4"></div>
        </div>

        <div id="tab2" class="flex-1 p-4 bg-gray-50 hidden fade-in">
            <div class="mb-4 relative">
                <input type="text" id="searchCompleted" placeholder="Tìm kiếm thư mục..." class="w-full pl-9 pr-3 py-2.5 rounded-lg border border-gray-300 focus:border-blue-500 transition-colors font-bold text-gray-700 text-sm shadow-sm">
                <svg class="w-4 h-4 absolute left-3 top-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <div class="grid grid-cols-2 gap-3" id="completedGrid"></div>
        </div>
    </div>

    <!-- Modal Thêm Nhanh (Dùng chung cho cả Sinh viên và VIP) -->
    <div id="quickAddModal" onclick="closeQuickAddModal()" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 fade-in cursor-pointer">
        <div onclick="event.stopPropagation()" class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative cursor-default">
            <button onclick="closeQuickAddModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            
            <h3 id="quickAddTitle" class="text-xl font-black text-purple-700 mb-1 flex items-center">Đăng ký thủ công</h3>
            <p id="quickAddDesc" class="text-xs text-gray-500 mb-4">Tạo nhanh thư mục và cấp mã bỏ qua bước điền form.</p>
            
            <form id="quickAddForm" class="space-y-4">
                <div>
                    <label id="quickAddLabel" class="block text-sm font-bold text-gray-700 mb-1">Mã số / Tên Thư Mục</label>
                    <input type="text" id="quickAddInput" required class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-purple-500 font-bold text-gray-800 uppercase">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Mật khẩu (6 số)</label>
                    <div class="relative">
                        <!-- Ô nhập mật khẩu Modal Thêm Nhanh -->
                        <input type="password" id="quickAddPassword" required placeholder="••••••" maxlength="6" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
                            class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-purple-500 font-black tracking-widest text-center text-lg pr-12 outline-none">
                        <button type="button" onclick="toggleQuickAddPassword()" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-gray-400 hover:text-purple-600 transition-colors flex items-center justify-center">
                            <svg id="quickAddEyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <input type="hidden" id="quickAddTypeVal" value="vip">

                <button type="submit" id="btnQuickAddSubmit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg shadow-lg active:scale-95 transition-transform mt-2">TẠO NHANH & XẾP HÀNG</button>
                <p id="quickAddError" class="text-red-500 text-xs font-bold text-center h-4 mt-2"></p>
            </form>
        </div>
    </div>

    <!-- Floating Loading Badge -->
    <div id="loadingIndicator" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-full shadow-2xl flex items-center z-50 transition-opacity">
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span class="text-sm font-semibold tracking-wide">Đang đồng bộ...</span>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz_m-F4cTM-vvyyaUs9Yf0QNoPxpuAFZtNbUQyYEy-GsxfgngyJHb3Lf-m-OlggkC1b/exec";
        
        let waitingData = [];
        let completedData = [];
        let isFirstLoad = true;
        
        // BỘ NHỚ LƯU TRỮ VÙNG CHỌN TAB 2
        let selectedItems = new Set(); 
        let lastSelectedMssv = null; 
        let currentRenderedList = []; 

        // BỘ NHỚ LƯU TRỮ VÙNG CHỌN TAB 1 (HÀNG ĐỢI)
        let selectedWaitItems = new Set();
        let lastSelectedWaitMssv = null;
        let currentWaitRenderedList = [];

        function switchTab(tabId) {
            localStorage.setItem('admin_current_tab', tabId);
            document.getElementById('tab1').classList.add('hidden');
            document.getElementById('tab2').classList.add('hidden');
            document.getElementById(tabId).classList.remove('hidden');

            document.getElementById('btnTab1').className = tabId === 'tab1' ? "flex-1 py-3 text-center tab-active transition-colors text-sm tracking-wide" : "flex-1 py-3 text-center tab-inactive transition-colors text-sm tracking-wide";
            document.getElementById('btnTab2').className = tabId === 'tab2' ? "flex-1 py-3 text-center tab-active transition-colors text-sm tracking-wide" : "flex-1 py-3 text-center tab-inactive transition-colors text-sm tracking-wide";
        }
        const initialAdminTab = localStorage.getItem('admin_current_tab') || 'tab1';
        switchTab(initialAdminTab);

        async function fetchAllData(isSilent = false) {
            if (!isSilent) document.getElementById('loadingIndicator').classList.remove('hidden');
            try {
                const response = await fetch(API_URL + "?action=get_all");
                const result = await response.json();
                
                if (result.status === 'success') {
                    // --- ĐỒNG BỘ TRẠNG THÁI HIỂN THỊ TRÊN NÚT ---
                    if (result.global_status) {
                        const statusMap = {
                            'ready': '🟢 Sẵn sàng đón khách', 'early': '🟡 Mở đăng ký sớm',
                            'crowded': '🟠 Đang quá tải', 'setup': '🔴 Đang Setup / Bảo trì',
                            'break': '🔴 Tạm nghỉ / Đổi ca', 'closed': '🔴 Đã đóng quầy'
                        };
                        document.getElementById('currentStatusText').textContent = statusMap[result.global_status] || '🟢 Sẵn sàng đón khách';
                    }

                    const newWaiting = result.data.filter(item => item.status === 'Waiting' || item.status === 'Active');
                    const newCompleted = result.data.filter(item => item.status === 'Completed').reverse();
                    
                    if (isFirstLoad || JSON.stringify(waitingData) !== JSON.stringify(newWaiting)) {
                        waitingData = newWaiting;
                        refreshWaitingUIAfterSelection();
                    }

                    if (isFirstLoad || JSON.stringify(completedData) !== JSON.stringify(newCompleted)) {
                        completedData = newCompleted;
                        refreshCompletedUIAfterSelection();
                    }
                    isFirstLoad = false;
                }
            } catch (error) {}
            if (!isSilent) document.getElementById('loadingIndicator').classList.add('hidden');
        }

        async function updateStatus(mssv, newStatus) {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'update_status', mssv: mssv, status: newStatus }) });
                const result = await response.json();
                if (result.status === 'success') fetchAllData();
                else alert("Lỗi: " + result.message);
            } catch (error) { alert("Lỗi mạng khi cập nhật!"); }
        }

        // ==========================================
        // XỬ LÝ DROPDOWN TRẠNG THÁI HIỆN ĐẠI
        // ==========================================
        function toggleStatusDropdown(event) {
            event.stopPropagation();
            const options = document.getElementById('statusOptions');
            const icon = document.getElementById('statusDropdownIcon');
            options.classList.toggle('hidden');
            options.classList.toggle('flex');
            icon.classList.toggle('rotate-180');
        }

        async function selectGlobalStatus(statusCode, statusText) {
            // 1. Đóng menu ngay lập tức
            const options = document.getElementById('statusOptions');
            options.classList.add('hidden'); options.classList.remove('flex');
            document.getElementById('statusDropdownIcon').classList.remove('rotate-180');
            
            // 2. Gửi API với khối finally để chống kẹt Loading
            document.getElementById('loadingIndicator').classList.remove('hidden');
            try {
                const response = await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'update_global_status', status_code: statusCode }) 
                });
                const result = await response.json();
                if (result.status === 'success') {
                    document.getElementById('currentStatusText').textContent = statusText;
                    await fetchAllData(true);
                } else {
                    alert("Lỗi cập nhật trạng thái: " + result.message);
                }
            } catch (error) { 
                alert("Lỗi mạng khi cập nhật trạng thái quầy!"); 
            } finally {
                // CHỐNG KẸT LOADING: Luôn tắt dù thành công hay rớt mạng
                document.getElementById('loadingIndicator').classList.add('hidden');
            }
        }

        // Hàm gửi lệnh đổi trạng thái quầy lên Google Apps Script
        async function changeGlobalStatus(statusCode) {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            try {
                const response = await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'update_global_status', status_code: statusCode }) 
                });
                const result = await response.json();
                if (result.status === 'success') {
                    // Ép load lại data ngay lập tức (thêm await để đồng bộ)
                    await fetchAllData(true);
                } else {
                    alert("Lỗi cập nhật trạng thái: " + result.message);
                }
            } catch (error) { 
                alert("Lỗi mạng khi cập nhật trạng thái quầy!"); 
            } finally {
                // LUÔN TẮT LOADING SAU KHI HOÀN THÀNH (Dù thành công hay lỗi)
                document.getElementById('loadingIndicator').classList.add('hidden');
            }
        }

        // ==========================================
        // VẼ & CHỌN VÙNG HÀNG ĐỢI (ĐA CHỌN)
        // ==========================================
        function renderWaitingUI(data) {
            const activeContainer = document.getElementById('activeStudentContainer');
            const waitingContainer = document.getElementById('waitingListContainer');
            
            activeContainer.innerHTML = '<span class="text-gray-400 italic text-sm font-medium">Trống - Sẵn sàng đón khách</span>';
            waitingContainer.innerHTML = '';
            let hasWaiting = false;

            // Lọc ra các sinh viên Waiting để phục vụ Multi-select (Không tính Active)
            currentWaitRenderedList = data.filter(item => item.status === 'Waiting').map(item => item.mssv);

            data.forEach(student => {
                if (student.status === 'Active') {
                    activeContainer.innerHTML = `
                        <div class="flex-1 overflow-hidden pr-2">
                            <p class="text-xl font-black text-blue-700 tracking-wider truncate">${student.name}</p>
                            <p class="text-sm font-bold text-gray-700 tracking-wider truncate">${student.mssv}</p>
                        </div>
                        <button onclick="updateStatus('${student.mssv}', 'Completed')" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-5 rounded-lg shadow-md active:scale-95 transition-transform ml-3 relative z-20">HOÀN THÀNH</button>
                    `;
                } else if (student.status === 'Waiting') {
                    hasWaiting = true;
                    const isVip = !/^[A-Za-z]{3}\d{6}$/.test(student.mssv); 
                    const badge = isVip ? `<span class="bg-purple-100 text-purple-700 text-[10px] px-2 py-0.5 rounded-full font-black uppercase ml-2">VIP</span>` : '';
                    
                    const isSelected = selectedWaitItems.has(student.mssv);
                    const cardBg = isSelected ? 'bg-blue-50 border-blue-400 shadow-md ring-1 ring-blue-400' : 'bg-white border-gray-100 shadow-sm hover:bg-gray-50';

                    waitingContainer.innerHTML += `
                        <div onclick="handleWaitCardClick(event, '${student.mssv}')" oncontextmenu="handleWaitContextMenu(event, '${student.mssv}')" class="flex justify-between items-center ${cardBg} p-3 rounded-xl gap-2 cursor-pointer select-none transition-colors">
                            <div class="flex-1 overflow-hidden pr-2">
                                <p class="text-sm font-bold text-gray-800 truncate">${student.name} ${badge}</p>
                                <p class="text-xs font-bold text-blue-600 truncate">${student.mssv} <span class="text-gray-400 font-normal ml-1">| Pass: ${student.password}</span></p>
                            </div>
                            <button onclick="event.stopPropagation(); updateStatus('${student.mssv}', 'Active')" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2.5 px-4 rounded-lg shadow-sm active:scale-95 transition-transform text-sm whitespace-nowrap relative z-20">VÀO CHỤP</button>
                            <div class="relative flex-shrink-0 z-20">

        async function batchOpenDrive() {
            document.getElementById('batchContextMenu').classList.add('hidden');

            for (let mssv of selectedItems) {
                const newTab = window.open('about:blank', '_blank');

                newTab.document.write(`<body style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;color:#666;"><h2>Đang tìm thư mục "${mssv}" trên Drive...</h2></body>`);

                try {
                    const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_folder_url', mssv: mssv }) });
                    const result = await response.json();
                    if (result.status === 'success') newTab.location.href = result.folderUrl; 
                    else newTab.document.write(`<body style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;color:red;"><h2>Lỗi: Thư mục chưa được đồng bộ!</h2></body>`);

        document.getElementById('quickAddForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const inputVal = document.getElementById('quickAddInput').value.trim().replace(/\s+/g, '');
            const pass = document.getElementById('quickAddPassword').value;
            const type = document.getElementById('quickAddTypeVal').value;
            const btn = document.getElementById('btnQuickAddSubmit');
            const err = document.getElementById('quickAddError');

            btn.disabled = true;
            btn.innerHTML = "ĐANG XỬ LÝ...";
            err.textContent = "";

            // ==============================================
            // NHÁNH 1: ÉP TẠO THƯ MỤC CHO SINH VIÊN (WAITING -> COMPLETED)
            // ==============================================
            if (type === 'student') {
                const isValid = /^[A-Za-z]{3}\d{6}$/.test(inputVal);
                if (!isValid) {
                    err.textContent = "Lỗi: Mã sinh viên phải gồm 3 chữ cái và 6 số (VD: BEC250024)!";
                    btn.disabled = false; btn.innerHTML = "TẠO THƯ MỤC NGAY";
                    return;
                }
                
                // BƯỚC 1: Tìm sinh viên trong Hàng đợi
                const studentInWait = waitingData.find(s => s.mssv === inputVal.toUpperCase() && s.status === 'Waiting');
                if (!studentInWait) {
                    err.textContent = "Lỗi: Không tìm thấy MSSV này trong Hàng đợi!";
                    btn.disabled = false; btn.innerHTML = "TẠO THƯ MỤC NGAY";
                    return;
                }
                
                // BƯỚC 2: Đối chiếu Mật khẩu
                if (String(studentInWait.password) !== pass) {
                    err.textContent = "Lỗi: Mật khẩu không khớp với lúc đăng ký!";
                    btn.disabled = false; btn.innerHTML = "TẠO THƯ MỤC NGAY";
                    return;
                }

                // BƯỚC 3: Thay vì đăng ký mới, cập nhật thẳng trạng thái sang Completed
                try {
                    const response = await fetch(API_URL, { 
                        method: 'POST', 
                        body: JSON.stringify({ action: 'update_status', mssv: inputVal.toUpperCase(), status: 'Completed' }) 
                    });
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        closeQuickAddModal();
                        switchTab('tab2'); // Chuyển thẳng sang Tab Lịch sử để Admin chiêm ngưỡng
                        fetchAllData();
                    } else err.textContent = result.message;
                } catch (error) { err.textContent = "Lỗi mạng!"; }
                
                btn.disabled = false; btn.innerHTML = "TẠO THƯ MỤC NGAY";
                return; // KẾT THÚC NHÁNH SINH VIÊN
            }

            // ==============================================
            // NHÁNH 2: TẠO MỚI KHÁCH VIP (GIỮ NGUYÊN NHƯ CŨ)
            // ==============================================
            try {
                const response = await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ 
                        action: 'register', 
                        mssv: inputVal, 
                        password: pass, 
                        name: 'Khách VIP' 
                    }) 
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    closeQuickAddModal();
                    switchTab('tab1'); 
                    fetchAllData();
                } else err.textContent = result.message;
            } catch (error) { err.textContent = "Lỗi mạng!"; }
            
            btn.disabled = false; btn.innerHTML = "TẠO NHANH & XẾP HÀNG";
        });

        fetchAllData();
        setInterval(() => fetchAllData(true), 10000); 
    </script>
</body>
</html>
