<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trạm điều khiển - Photobooth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="password"]::-ms-reveal, input[type="password"]::-ms-clear { display: none; }
        input[type="password"]::-webkit-reveal { display: none; }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 800; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #6b7280; font-weight: 600; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-24">

    <!-- MENU NỔI (DÙNG CHUNG CHO CHUỘT PHẢI & NÚT 3 CHẤM) -->
    <div id="batchContextMenu" class="hidden fixed w-48 bg-white rounded-lg shadow-2xl border border-gray-200 z-[100] overflow-hidden">
        <button id="ctxMenuDrive" onclick="batchOpenDrive()" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-700 hover:bg-blue-50 border-b border-gray-100 flex items-center">
            🔗 Mở thư mục Drive
        </button>
        <button id="ctxMenuEdit" onclick="batchEditMSSV()" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-700 hover:bg-blue-50 border-b border-gray-100 flex items-center">
            ✏️ Sửa Tên/MSSV
        </button>
        <button id="ctxMenuView" onclick="batchViewPasswords()" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-700 hover:bg-blue-50 border-b border-gray-100 flex items-center">
            👁️ Xem Mật khẩu
        </button>
        <button id="ctxMenuDelete" onclick="batchDelete()" class="w-full text-left px-4 py-3 text-xs font-bold text-red-600 hover:bg-red-50 flex items-center">
            🗑️ Xóa thư mục
        </button>
    </div>

    <div class="max-w-md mx-auto bg-white shadow-xl min-h-screen relative overflow-hidden flex flex-col">
        
        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 text-center relative shadow-md z-20">
            <h1 class="text-2xl font-black tracking-wider uppercase">ĐIỀU PHỐI PHOTOBOOTH</h1>
            <button onclick="fetchAllData()" class="absolute top-4 right-4 bg-blue-500 hover:bg-blue-700 p-2 rounded-full active:scale-95 transition-transform shadow-md">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>

        <!-- Khối ghim cố định: Người đang chụp -->
        <div class="p-4 bg-blue-50 border-b border-blue-100 z-10 shadow-sm">
            <h2 class="text-xs font-bold text-blue-500 uppercase mb-2 tracking-wider flex items-center">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse mr-2"></span> LƯỢT CHỤP HIỆN TẠI
            </h2>
            <div id="activeStudentContainer" class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500 min-h-[80px]">
                <span class="text-gray-400 italic text-sm font-medium">Trống - Sẵn sàng đón khách</span>
            </div>
        </div>

        <!-- Navbar Tabs -->
        <div class="flex bg-white shadow-sm z-10 sticky top-0 border-b border-gray-200">
            <button id="btnTab1" onclick="switchTab('tab1')" class="flex-1 py-3 text-center tab-active transition-colors text-sm tracking-wide">HÀNG ĐỢI</button>
            <button id="btnTab2" onclick="switchTab('tab2')" class="flex-1 py-3 text-center tab-inactive transition-colors text-sm tracking-wide">LỊCH SỬ THƯ MỤC</button>
        </div>

        <!-- TAB 1: HÀNG ĐỢI & VIP -->
        <div id="tab1" class="flex-1 p-4 fade-in">
            <div class="flex gap-2 mb-4">
                <div class="relative flex-1">
                    <input type="text" id="searchWaiting" placeholder="Tìm MSSV đang đợi..." class="w-full pl-9 pr-3 py-2.5 rounded-lg border border-gray-300 focus:border-blue-500 transition-colors uppercase font-bold text-gray-700 text-sm">
                    <svg class="w-4 h-4 absolute left-3 top-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <button onclick="openVipModal()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2.5 rounded-lg font-bold text-sm shadow-md active:scale-95 transition-transform flex items-center">+ VIP</button>
            </div>
            <div id="waitingListContainer" class="space-y-3 pb-4"></div>
        </div>

        <!-- TAB 2: LỊCH SỬ -->
        <div id="tab2" class="flex-1 p-4 bg-gray-50 hidden fade-in">
            <div class="mb-4 relative">
                <input type="text" id="searchCompleted" placeholder="Tìm kiếm thư mục..." class="w-full pl-9 pr-3 py-2.5 rounded-lg border border-gray-300 focus:border-blue-500 transition-colors font-bold text-gray-700 text-sm shadow-sm">
                <svg class="w-4 h-4 absolute left-3 top-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <div class="grid grid-cols-2 gap-3" id="completedGrid"></div>
        </div>
    </div>

    <!-- Modal Đăng ký VIP -->
    <div id="vipModal" onclick="closeVipModal()" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 fade-in cursor-pointer">
        <div onclick="event.stopPropagation()" class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative cursor-default">
            <button onclick="closeVipModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            <h3 class="text-xl font-black text-purple-700 mb-1 flex items-center">Đăng ký Khách VIP</h3>
            <p class="text-xs text-gray-500 mb-4">Tạo nhanh thư mục và cấp mã cho Thầy cô/Khách mời.</p>
            <form id="vipForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Tên Thư Mục VIP</label>
                    <input type="text" id="vipName" required placeholder="VD: Thầy Hoàng" class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-purple-500 font-bold text-gray-800">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Mật khẩu (6 số)</label>
                    <div class="relative">
                        <input type="password" id="vipPassword" required placeholder="••••••" maxlength="6" inputmode="numeric" class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-purple-500 font-black tracking-widest text-center text-lg pr-12">
                        <button type="button" onclick="toggleVipPassword()" class="absolute right-3 top-3.5 text-gray-400 hover:text-purple-600"><svg id="vipEyeIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></button>
                    </div>
                </div>
                <button type="submit" id="btnVipSubmit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg shadow-lg active:scale-95 transition-transform mt-2">TẠO NHANH & XẾP HÀNG</button>
                <p id="vipError" class="text-red-500 text-xs font-bold text-center h-4 mt-2"></p>
            </form>
        </div>
    </div>

    <!-- Floating Loading Badge -->
    <div id="loadingIndicator" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-full shadow-2xl flex items-center z-50 transition-opacity">
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span class="text-sm font-semibold tracking-wide">Đang đồng bộ...</span>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz_m-F4cTM-vvyyaUs9Yf0QNoPxpuAFZtNbUQyYEy-GsxfgngyJHb3Lf-m-OlggkC1b/exec";
        
        let waitingData = [];
        let completedData = [];
        let openMenuMssv = null; 
        let isFirstLoad = true;

        // BỘ NHỚ LƯU TRỮ VÙNG CHỌN GIỐNG GOOGLE DRIVE
        let selectedItems = new Set(); 
        let lastSelectedMssv = null; 
        let currentRenderedList = []; 

        function switchTab(tabId) {
            // Lưu trạng thái tab Admin vào trình duyệt
            localStorage.setItem('admin_current_tab', tabId);

            document.getElementById('tab1').classList.add('hidden');
            document.getElementById('tab2').classList.add('hidden');
            document.getElementById(tabId).classList.remove('hidden');

            document.getElementById('btnTab1').className = tabId === 'tab1' ? "flex-1 py-3 text-center tab-active transition-colors text-sm tracking-wide" : "flex-1 py-3 text-center tab-inactive transition-colors text-sm tracking-wide";
            document.getElementById('btnTab2').className = tabId === 'tab2' ? "flex-1 py-3 text-center tab-active transition-colors text-sm tracking-wide" : "flex-1 py-3 text-center tab-inactive transition-colors text-sm tracking-wide";
        }

        // Tự động khôi phục đúng Tab trước đó khi Admin F5
        const initialAdminTab = localStorage.getItem('admin_current_tab') || 'tab1';
        switchTab(initialAdminTab);

        async function fetchAllData(isSilent = false) {
            if (!isSilent) document.getElementById('loadingIndicator').classList.remove('hidden');
            try {
                const response = await fetch(API_URL + "?action=get_all");
                const result = await response.json();
                
                if (result.status === 'success') {
                    const newWaiting = result.data.filter(item => item.status === 'Waiting' || item.status === 'Active');
                    const newCompleted = result.data.filter(item => item.status === 'Completed').reverse();
                    
                    if (isFirstLoad || JSON.stringify(waitingData) !== JSON.stringify(newWaiting)) {
                        waitingData = newWaiting;
                        const keyword = document.getElementById('searchWaiting').value.toUpperCase();
                        renderWaitingUI(waitingData.filter(item => item.status === 'Active' || item.mssv.toUpperCase().includes(keyword) || (item.name && item.name.toUpperCase().includes(keyword))));
                    }

                    if (isFirstLoad || JSON.stringify(completedData) !== JSON.stringify(newCompleted)) {
                        completedData = newCompleted;
                        refreshCompletedUIAfterSelection();
                    }
                    isFirstLoad = false;
                }
            } catch (error) {}
            if (!isSilent) document.getElementById('loadingIndicator').classList.add('hidden');
        }

        async function updateStatus(mssv, newStatus) {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'update_status', mssv: mssv, status: newStatus }) });
                const result = await response.json();
                if (result.status === 'success') fetchAllData();
                else alert("Lỗi: " + result.message);
            } catch (error) { alert("Lỗi mạng khi cập nhật!"); }
        }

        function renderWaitingUI(data) {
            const activeContainer = document.getElementById('activeStudentContainer');
            const waitingContainer = document.getElementById('waitingListContainer');
            
            activeContainer.innerHTML = '<span class="text-gray-400 italic text-sm font-medium">Trống - Sẵn sàng đón khách</span>';
            waitingContainer.innerHTML = '';
            let hasWaiting = false;

            data.forEach(student => {
                if (student.status === 'Active') {
                    activeContainer.innerHTML = `
                        <div class="flex-1 overflow-hidden pr-2">
                            <p class="text-xl font-black text-blue-700 tracking-wider truncate">${student.name}</p>
                            <p class="text-sm font-bold text-gray-700 tracking-wider truncate">${student.mssv}</p>
                        </div>
                        <button onclick="updateStatus('${student.mssv}', 'Completed')" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-5 rounded-lg shadow-md active:scale-95 transition-transform ml-3">HOÀN THÀNH</button>
                    `;
                } else if (student.status === 'Waiting') {
                    hasWaiting = true;
                    const isVip = !/^[A-Za-z]{3}\d{6}$/.test(student.mssv); 
                    const badge = isVip ? `<span class="bg-purple-100 text-purple-700 text-[10px] px-2 py-0.5 rounded-full font-black uppercase ml-2">VIP</span>` : '';
                    
                    // Tab Hàng đợi vẫn giữ menu thả xuống nguyên bản
                    const menuClass = (openMenuMssv === 'wait-' + student.mssv) ? "" : "hidden";

                    waitingContainer.innerHTML += `
                        <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-gray-100 gap-2 group">
                            <div class="flex-1 overflow-hidden pr-2">
                                <p class="text-sm font-bold text-gray-800 truncate">${student.name} ${badge}</p>
                                <p class="text-xs font-bold text-blue-600 truncate">${student.mssv} <span class="text-gray-400 font-normal ml-1">| Pass: ${student.password}</span></p>
                            </div>
                            <button onclick="updateStatus('${student.mssv}', 'Active')" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2.5 px-4 rounded-lg shadow-sm active:scale-95 transition-transform text-sm whitespace-nowrap">VÀO CHỤP</button>
                            <div class="relative group-menu flex-shrink-0">
                                <button onclick="toggleMenuWait(event, 'wait-${student.mssv}')" class="text-gray-400 hover:text-gray-800 transition-colors p-2 rounded-md hover:bg-gray-100 bg-white border border-transparent hover:border-gray-200">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM12 10a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 100-4 2 2 0 000 4z"></path></svg>
                                </button>
                                <div id="menu-wait-${student.mssv}" class="dropdown-menu-wait ${menuClass} absolute right-0 mt-2 w-36 bg-white rounded-lg shadow-xl border border-gray-200 z-50 overflow-hidden">
                                    <button onclick="editMSSV_Wait('${student.mssv}')" class="w-full text-left px-4 py-2.5 text-xs font-bold text-gray-700 hover:bg-blue-50 border-b border-gray-100 flex items-center">✏️ Sửa Tên/MSSV</button>
                                    <button onclick="deleteRecordWait('${student.mssv}')" class="w-full text-left px-4 py-2.5 text-xs font-bold text-red-600 hover:bg-red-50 flex items-center">🗑️ Hủy đăng ký</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
            if (!hasWaiting) waitingContainer.innerHTML = '<div class="text-center text-gray-400 italic py-8 border-2 border-dashed border-gray-200 rounded-xl">Hàng chờ đang trống.</div>';
        }

        // ==========================================
        // VẼ KHO ẢNH (HỖ TRỢ CHỌN CHUỘT NHIỀU FILE & CLICK CHUỘT PHẢI)
        // ==========================================
        function renderCompletedUI(list) {
            const grid = document.getElementById('completedGrid');
            grid.innerHTML = '';
            
            // Lưu mảng hiện tại để chạy vòng lặp chọn Shift-Click
            currentRenderedList = list.map(item => item.mssv);
            
            if(list.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center text-gray-400 py-8 font-medium">Chưa có khách hoàn thành.</div>`;
                return;
            }

            list.forEach(item => {
                const mssv = item.mssv;
                const isVip = !/^[A-Za-z]{3}\d{6}$/.test(mssv);
                const color = isVip ? 'text-purple-500' : 'text-blue-500';
                
                const nameHtml = (isVip || item.name === 'Khách VIP') ? `<div class="mb-3 h-[15px]"></div>` : `<span class="text-[10px] text-gray-400 font-medium truncate w-full text-center px-2 mb-3" title="${item.name}">${item.name}</span>`;

                // Xóa biến isChecked và thẻ input checkbox đi
                const cardBg = selectedItems.has(mssv) ? 'bg-blue-50 border-blue-400 shadow-md ring-1 ring-blue-400' : 'bg-white border-gray-100 shadow-sm hover:bg-gray-50';

                // Ô vuông được gắn sự kiện onclick (Click thường/Ctrl/Shift) và oncontextmenu (Chuột phải)
                grid.innerHTML += `
                    <div onclick="handleCardClick(event, '${mssv}')" oncontextmenu="handleContextMenu(event, '${mssv}')" class="${cardBg} p-3 rounded-xl border flex flex-col items-center justify-between h-full relative cursor-pointer select-none transition-colors">

                        <!-- Nút 3 chấm mồi (gọi ra menu nổi giống click chuột phải) -->
                        <div class="absolute top-2 right-2 z-20">
                            <button onclick="openThreeDotMenu(event, '${mssv}')" class="text-gray-400 hover:text-gray-800 transition-colors p-1.5 rounded-md hover:bg-gray-200 shadow-sm border border-transparent">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM12 10a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 100-4 2 2 0 000 4z"></path></svg>
                            </button>
                        </div>

                        <svg class="w-10 h-10 ${color} mb-1 opacity-80 mt-3" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                        <span class="font-bold text-gray-700 tracking-wide text-sm truncate w-full text-center px-2 mt-1" title="${mssv}">${mssv}</span>
                        ${nameHtml}
                        
                        <!-- Chặn sự kiện click để không chọn nhầm khi bấm Chụp bổ sung -->
                        <button onclick="event.stopPropagation(); updateStatus('${mssv}', 'Active')" class="w-full bg-gray-100 hover:bg-blue-200 text-blue-600 font-bold py-2 rounded-lg text-xs transition-colors border border-gray-200 z-20 relative">
                            Chụp bổ sung
                        </button>
                    </div>
                `;
            });
        }

        // ==========================================
        // CÁC HÀM XỬ LÝ CHỌN VÙNG VÀ CHUỘT PHẢI
        // ==========================================
        function refreshCompletedUIAfterSelection() {
            const keyword = document.getElementById('searchCompleted').value.toUpperCase();
            renderCompletedUI(completedData.filter(item => item.mssv.toUpperCase().includes(keyword) || (item.name && item.name.toUpperCase().includes(keyword))));
        }

        // Bấm vào cả một Ô thư mục (Xử lý Ctrl, Shift, Click chuột trái, Bỏ chọn)
        function handleCardClick(event, mssv) {
            if (event.shiftKey && lastSelectedMssv) {
                const currentIndex = currentRenderedList.indexOf(mssv);
                const lastIndex = currentRenderedList.indexOf(lastSelectedMssv);
                if (currentIndex !== -1 && lastIndex !== -1) {
                    const start = Math.min(currentIndex, lastIndex);
                    const end = Math.max(currentIndex, lastIndex);
                    if (!event.ctrlKey && !event.metaKey) selectedItems.clear(); 
                    for (let i = start; i <= end; i++) selectedItems.add(currentRenderedList[i]);
                }
            } else if (event.ctrlKey || event.metaKey) {
                if (selectedItems.has(mssv)) selectedItems.delete(mssv);
                else selectedItems.add(mssv);
                lastSelectedMssv = mssv;
            } else {
                // TÍNH NĂNG MỚI: Bấm lại vào ô đang được chọn duy nhất thì sẽ Bỏ chọn ô đó
                if (selectedItems.has(mssv) && selectedItems.size === 1) {
                    selectedItems.delete(mssv);
                    lastSelectedMssv = null;
                } else {
                    selectedItems.clear();
                    selectedItems.add(mssv);
                    lastSelectedMssv = mssv;
                }
            }
            refreshCompletedUIAfterSelection();
        }

        // Bấm nút 3 chấm (Thay vì hiện menu tại ô đó, sẽ hiện Menu nổi)
        function openThreeDotMenu(event, mssv) {
            event.stopPropagation();
            if (!selectedItems.has(mssv)) {
                selectedItems.clear();
                selectedItems.add(mssv);
                lastSelectedMssv = mssv;
                refreshCompletedUIAfterSelection();
            }
            handleContextMenu(event, mssv);
        }

        // Click Chuột phải (Hiện Menu Nổi)
        function handleContextMenu(event, mssv) {
            event.preventDefault(); 
            
            if (!selectedItems.has(mssv)) {
                selectedItems.clear();
                selectedItems.add(mssv);
                lastSelectedMssv = mssv;
                refreshCompletedUIAfterSelection();
            }

            // Đổi chữ trong menu nổi theo số lượng chọn
            const count = selectedItems.size;
            document.getElementById('ctxMenuDrive').innerHTML = count > 1 ? `🔗 Mở thư mục Drive (${count})` : `🔗 Mở thư mục Drive`;
            document.getElementById('ctxMenuEdit').innerHTML = count > 1 ? `✏️ Sửa Tên/MSSV (${count})` : `✏️ Sửa Tên/MSSV`;
            document.getElementById('ctxMenuView').innerHTML = count > 1 ? `👁️ Xem Mật khẩu (${count})` : `👁️ Xem Mật khẩu`;
            document.getElementById('ctxMenuDelete').innerHTML = count > 1 ? `🗑️ Xóa thư mục (${count})` : `🗑️ Xóa thư mục`;

            const menu = document.getElementById('batchContextMenu');
            menu.classList.remove('hidden');
            
            let x = event.clientX; let y = event.clientY;
            if (x + 200 > window.innerWidth) x = window.innerWidth - 200; 
            if (y + 150 > window.innerHeight) y = window.innerHeight - 150;

            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
        }

        // ==========================================
        // CÁC HÀM XỬ LÝ HÀNG LOẠT TỪ MENU NỔI
        // ==========================================
        
        // Mở thư mục Google Drive hàng loạt
        async function batchOpenDrive() {
            document.getElementById('batchContextMenu').classList.add('hidden');
            if (selectedItems.size === 0) return;

            // Xử lý mở từng tab
            for (let mssv of selectedItems) {
                // Tạo tab rỗng ngay lập tức khi click để lách bộ chặn Popup Blocker của trình duyệt
                const newTab = window.open('about:blank', '_blank');
                if (!newTab) {
                    alert("Trình duyệt đang chặn mở tab mới! Vui lòng cấp quyền (Allow Pop-ups) cho trang web này ở thanh địa chỉ phía trên.");
                    return;
                }
                newTab.document.write(`<body style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;color:#666;"><h2>Đang tìm thư mục "${mssv}" trên Drive...</h2></body>`);

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'get_folder_url', mssv: mssv })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        newTab.location.href = result.folderUrl; // Chuyển hướng tab sang link Drive
                    } else {
                        newTab.document.write(`<body style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;color:red;"><h2>Lỗi: Thư mục chưa được đồng bộ!</h2></body>`);
                    }
                } catch (e) {
                    newTab.document.write(`<body style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;color:red;"><h2>Lỗi mạng!</h2></body>`);
                }
            }
            selectedItems.clear();
            refreshCompletedUIAfterSelection();
        }

        async function batchEditMSSV() {
            document.getElementById('batchContextMenu').classList.add('hidden');
            if (selectedItems.size === 0) return;
            
            for (let oldMssv of selectedItems) {
                const newMssv = prompt(`Sửa tên/MSSV cho "${oldMssv}":\nNhập tên/mã mới (hoặc bấm Hủy):`, oldMssv);
                if (newMssv && newMssv.trim() !== oldMssv) {
                    const isStandard = /^[a-zA-Z]{3}\d{6}$/.test(newMssv.trim());
                    const finalMssv = isStandard ? newMssv.trim().toUpperCase() : newMssv.trim();

                    document.getElementById('loadingIndicator').classList.remove('hidden');
                    try {
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'update_mssv', old_mssv: oldMssv, new_mssv: finalMssv }) });
                    } catch (e) { alert("Lỗi khi sửa " + oldMssv); }
                }
            }
            selectedItems.clear();
            fetchAllData();
        }

        function batchViewPasswords() {
            document.getElementById('batchContextMenu').classList.add('hidden');
            if (selectedItems.size === 0) return;
            
            let msg = "MẬT KHẨU CÁC THƯ MỤC ĐÃ CHỌN:\n\n";
            selectedItems.forEach(mssv => {
                const item = completedData.find(d => d.mssv === mssv);
                if (item) msg += `📂 ${mssv}  ➔  🔑 ${item.password}\n`;
            });
            alert(msg);
        }

        async function batchDelete() {
            document.getElementById('batchContextMenu').classList.add('hidden');
            if (selectedItems.size === 0) return;

            if (!confirm(`CẢNH BÁO: Bạn có chắc muốn xóa vĩnh viễn ${selectedItems.size} thư mục đã chọn?`)) return;

            document.getElementById('loadingIndicator').classList.remove('hidden');
            for (let mssv of selectedItems) {
                try {
                    await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_record', mssv: mssv }) });
                } catch (e) {}
            }
            selectedItems.clear();
            fetchAllData();
        }

        // Các hàm xử lý Hàng đợi (Wait) đơn lẻ
        async function editMSSV_Wait(oldMssv) {
            const newMssv = prompt(`Sửa tên/MSSV cho ${oldMssv}:`, oldMssv);
            if (!newMssv || newMssv.trim() === oldMssv) return;
            const isStandard = /^[a-zA-Z]{3}\d{6}$/.test(newMssv.trim());
            const finalMssv = isStandard ? newMssv.trim().toUpperCase() : newMssv.trim();
            document.getElementById('loadingIndicator').classList.remove('hidden');
            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'update_mssv', old_mssv: oldMssv, new_mssv: finalMssv }) });
                const result = await response.json();
                if (result.status === 'success') { openMenuMssv = null; fetchAllData(); }
            } catch (error) {}
        }

        async function deleteRecordWait(mssv) {
            if(!confirm(`Xóa hàng đợi của ${mssv}?`)) return;
            document.getElementById('loadingIndicator').classList.remove('hidden');
            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_record', mssv: mssv }) });
                const result = await response.json();
                if (result.status === 'success') fetchAllData();
            } catch (error) {}
        }

        function toggleMenuWait(event, id) {
            event.stopPropagation();
            if (openMenuMssv === id) { document.getElementById('menu-' + id).classList.add('hidden'); openMenuMssv = null; return; }
            document.querySelectorAll('.dropdown-menu-wait').forEach(el => el.classList.add('hidden'));
            document.getElementById('menu-' + id).classList.remove('hidden');
            openMenuMssv = id;
        }

        // Tự động đóng menu nếu click ra ngoài
        document.addEventListener('click', function(e) {
            const batchMenu = document.getElementById('batchContextMenu');
            if (batchMenu && !e.target.closest('#batchContextMenu')) batchMenu.classList.add('hidden');
            if (!e.target.closest('.group-menu')) {
                document.querySelectorAll('.dropdown-menu-wait').forEach(el => el.classList.add('hidden'));
                openMenuMssv = null;
            }
        });

        document.getElementById('searchWaiting').addEventListener('input', function(e) {
            const keyword = e.target.value.toUpperCase();
            renderWaitingUI(waitingData.filter(item => item.status === 'Active' || item.mssv.toUpperCase().includes(keyword) || (item.name && item.name.toUpperCase().includes(keyword))));
        });

        document.getElementById('searchCompleted').addEventListener('input', function() { refreshCompletedUIAfterSelection(); });

        // ==========================================
        // Modal VIP
        // ==========================================
        function openVipModal() { document.getElementById('vipModal').classList.remove('hidden'); }
        function closeVipModal() { document.getElementById('vipModal').classList.add('hidden'); }
        function toggleVipPassword() {
            const pwd = document.getElementById('vipPassword');
            const eyeIcon = document.getElementById('vipEyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
            } else {
                pwd.type = 'password';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>';
            }
        }

        document.getElementById('vipForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('vipName').value.trim();
            const pass = document.getElementById('vipPassword').value;
            const btn = document.getElementById('btnVipSubmit');
            const err = document.getElementById('vipError');

            btn.disabled = true;
            btn.innerHTML = "ĐANG TẠO...";
            err.textContent = "";

            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'register', mssv: name, password: pass, name: 'Khách VIP' }) });
                const result = await response.json();
                
                if (result.status === 'success') {
                    closeVipModal(); document.getElementById('vipName').value = ''; document.getElementById('vipPassword').value = '';
                    switchTab('tab1'); fetchAllData();
                } else err.textContent = result.message;
            } catch (error) { err.textContent = "Lỗi mạng!"; }
            btn.disabled = false; btn.innerHTML = "TẠO NHANH & XẾP HÀNG";
        });

        fetchAllData();
        setInterval(() => fetchAllData(true), 10000); 
    </script>
</body>
</html>
